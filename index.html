<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC GameChanger - Premium Predictions</title>

  <meta name="description" content="FC GameChanger – Premium match predictions, fast alerts & 98% accuracy. Join our VIP Telegram now!" />

  <style>
    /* RESET */
    * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}

    body {
      background:#000;
      color:#fff;
      text-align:center;
      overflow-x:hidden;
    }

    /* PREMIUM GRADIENT BACKGROUND */
    .bg {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: radial-gradient(circle at top, #ff1a1a33, #000000 70%);
      z-index:-1;
    }

    /* HEADER / HERO SECTION */
    .hero {
      padding:45px 20px 20px;
    }

    .hero img {
      width:170px;
      height:170px;
      border-radius:50%;
      border:4px solid #ff1a1a;
      box-shadow:0 0 25px #ff1a1a66;
    }

    h1 {
      font-size:36px;
      margin-top:18px;
      font-weight:700;
      text-shadow:0 0 10px #ff1a1a99;
    }

    .tagline {
      font-size:18px;
      color:#ddd;
      margin-top:8px;
    }

    /* STATS CARDS */
    .stats {
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
      margin:25px 0;
    }

    .box {
      background:#111;
      padding:15px 25px;
      border-radius:14px;
      border:1px solid #222;
      font-size:18px;
      box-shadow:0 0 10px #ff1a1a33;
    }

    /* CTA BUTTON */
    .join-btn {
      background:linear-gradient(90deg, #ff1a1a, #b30000);
      color:white;
      padding:18px 30px;
      border-radius:50px;
      font-size:20px;
      border:none;
      cursor:pointer;
      width:85%;
      max-width:360px;
      font-weight:700;
      box-shadow:0 0 20px #ff1a1a55;
      transition:0.2s;
    }

    .join-btn:hover {
      transform:scale(1.03);
      box-shadow:0 0 30px #ff1a1a88;
    }

    /* FEATURES */
    .features {
      margin-top:45px;
      padding-bottom:50px;
    }

    .feature-item {
      margin:12px 0;
      font-size:19px;
      background:#0d0d0d;
      padding:12px;
      width:85%;
      max-width:380px;
      border-radius:10px;
      margin-left:auto;
      margin-right:auto;
      border:1px solid #1a1a1a;
      box-shadow:0 0 10px #ff1a1a22;
    }

  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="hero">
    <img src="22f483627b5f6b277721f7adaff51842.jpg" alt="FC GameChanger" />

    <h1>FC GAMECHANGER ⚽🔥</h1>
    <div class="tagline">Ultra Premium Match Predictions • Instant Alerts</div>

    <div class="stats">
      <div class="box">🔥 98% Accuracy</div>
      <div class="box">👥 65K+ Members</div>
      <div class="box">⚡ Instant Tips</div>
    </div>

    <button class="join-btn" onclick="window.location='https://t.me/+MFdq6qFMpkMxOWJl'">
      JOIN VIP TELEGRAM CHANNEL
    </button>
  </div>

  <div class="features">
    <div class="feature-item">✔ Real-Time Match Predictions</div>
    <div class="feature-item">✔ Expert Stats & Analysis</div>
    <div class="feature-item">✔ Daily High-Accuracy Tips</div>
    <div class="feature-item">✔ Fast Telegram Notifications</div>
    <div class="feature-item">✔ Safe, Simple & Trusted</div>
  </div>

</body>
</html>
